name: Daily auto-merge to main

# Once a day, merge the day's accumulated work into main — regardless of which branch
# it lives on. It scans every OPEN, non-draft PR targeting main and merges the ones whose
# CI ("Test, build, and validate Worker") is green and that are conflict-free.
#
# Opt out of a given day's merge by either marking the PR as a draft or adding the "hold"
# label. Runs 04:00 Asia/Shanghai (20:00 UTC); also runnable manually via "Run workflow".

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: daily-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge green, conflict-free PRs into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_NAME: 'Test, build, and validate Worker'
        run: |
          set -euo pipefail

          # Open, non-draft PRs to main that are NOT labelled "hold".
          mapfile -t prs < <(
            gh pr list --repo "$REPO" --base main --state open \
              --json number,isDraft,labels,headRefOid,headRefName \
              --jq '.[] | select(.isDraft==false) | select([.labels[].name] | index("hold") | not) | [.number, .headRefOid, .headRefName] | @tsv'
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No eligible PRs targeting main. Nothing to merge."
            exit 0
          fi

          merged=0 skipped=0
          for row in "${prs[@]}"; do
            num=$(printf '%s' "$row" | cut -f1)
            sha=$(printf '%s' "$row" | cut -f2)
            head=$(printf '%s' "$row" | cut -f3)
            echo "::group::PR #$num ($head)"

            conclusion=$(gh api "repos/$REPO/commits/$sha/check-runs" \
              --jq "[.check_runs[] | select(.name==\"$CHECK_NAME\")] | sort_by(.started_at) | last | .conclusion" 2>/dev/null || echo "")

            if [ "$conclusion" != "success" ]; then
              echo "SKIP: CI for '$CHECK_NAME' is '${conclusion:-missing}' (not success)."
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            if gh pr merge "$num" --repo "$REPO" --merge; then
              echo "MERGED PR #$num."
              merged=$((merged+1))
            else
              echo "SKIP: merge failed (conflicts or branch protection)."
              skipped=$((skipped+1))
            fi
            echo "::endgroup::"
          done

          echo "Done. Merged: $merged, Skipped: $skipped."
