name: Daily auto-merge to main

# Once a day, merge eligible VPS-generated data refresh PRs into main. Scope is a
# strict branch whitelist: the PokeDB environment and VGCPastes team-library
# automation branches only. Feature/agent PRs are never auto-merged — merge those
# manually. Merging into main triggers the Cloudflare Workers Builds production
# deploy, so anything this workflow merges goes live.
#
# A PR is merged only when it comes from this repo, changes nothing but the files its
# refresh script generates, its CI ("Test, build, and validate Worker") is green,
# it is conflict-free, and its head contains the current main branch. A stale PR
# is left open for the automation to rebuild from the latest main and rerun CI.
#
# Use the "hold" label for a durable manual pause. Draft PRs are skipped by this
# workflow too, but the refresh script turns an existing automation PR back to ready
# on its next run. Runs 04:00 Asia/Shanghai (20:00 UTC); also runnable manually.

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: daily-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge green, current, conflict-free PRs into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_NAME: 'Test, build, and validate Worker'
          AUTOMATION_BRANCHES: 'automation/pokedb-environment-refresh automation/vgcpastes-team-refresh'
        run: |
          set -euo pipefail

          merged=0 skipped=0
          for AUTOMATION_BRANCH in $AUTOMATION_BRANCHES; do
            # Open, non-draft PRs to main from this whitelisted branch only, minus "hold".
            mapfile -t prs < <(
              gh pr list --repo "$REPO" --base main --head "$AUTOMATION_BRANCH" --state open \
                --json number,isDraft,labels,headRefOid,headRefName \
                --jq '.[] | select(.isDraft==false) | select([.labels[].name] | index("hold") | not) | [.number, .headRefOid, .headRefName] | @tsv'
            )

            if [ "${#prs[@]}" -eq 0 ]; then
              echo "No eligible PRs from $AUTOMATION_BRANCH targeting main."
              continue
            fi

            for row in "${prs[@]}"; do
              num=$(printf '%s' "$row" | cut -f1)
              sha=$(printf '%s' "$row" | cut -f2)
              head=$(printf '%s' "$row" | cut -f3)
              echo "::group::PR #$num ($head)"

              # The branch name alone proves nothing: anyone who can push can put a code or
              # workflow change on an automation branch, and it would go live unreviewed.
              # Require a same-repo PR whose every file is one its refresh script generates
              # (generatedSnapshotPaths in scripts/create-*-refresh-pr.mjs). This also keeps a
              # PR from rewriting ci.yml to hand itself a green check of the same name.
              case "$head" in
                automation/pokedb-environment-refresh)
                  allowed='^(src/data/external/pokedb/current_environment_snapshot\.json|public/data/pokedb/reg-ma-environment\.json)$' ;;
                automation/vgcpastes-team-refresh)
                  allowed='^src/data/external/vgcpastes/reg_[a-z0-9_]+_(team_samples|audit)\.json$' ;;
                *)
                  allowed='^$' ;;
              esac

              cross_repo=$(gh pr view "$num" --repo "$REPO" --json isCrossRepository --jq '.isCrossRepository' 2>/dev/null || echo "")
              if [ "$cross_repo" != "false" ]; then
                echo "SKIP: PR comes from a fork (or its origin could not be read)."
                skipped=$((skipped+1)); echo "::endgroup::"; continue
              fi

              if ! files=$(gh api --paginate "repos/$REPO/pulls/$num/files" --jq '.[].filename' 2>/dev/null) || [ -z "$files" ]; then
                echo "SKIP: could not list the PR's changed files."
                skipped=$((skipped+1)); echo "::endgroup::"; continue
              fi
              unexpected=$(printf '%s\n' "$files" | grep -v -E "$allowed" || true)
              if [ -n "$unexpected" ]; then
                echo "SKIP: PR touches files outside its generated data set — merge it by hand after review:"
                printf '  %s\n' $unexpected
                skipped=$((skipped+1)); echo "::endgroup::"; continue
              fi

              conclusion=$(gh api "repos/$REPO/commits/$sha/check-runs" \
                --jq "[.check_runs[] | select(.name==\"$CHECK_NAME\")] | sort_by(.started_at) | last | .conclusion" 2>/dev/null || echo "")

              if [ "$conclusion" != "success" ]; then
                echo "SKIP: CI for '$CHECK_NAME' is '${conclusion:-missing}' (not success)."
                skipped=$((skipped+1)); echo "::endgroup::"; continue
              fi

              # CI may have passed before another PR advanced main. Require this head to
              # contain the current main so the tested branch is not merged from a stale base.
              main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)
              if [ -z "$main_sha" ]; then
                echo "SKIP: could not resolve the current main SHA."
                skipped=$((skipped+1)); echo "::endgroup::"; continue
              fi

              behind_by=$(gh api "repos/$REPO/compare/$main_sha...$sha" --jq '.behind_by' 2>/dev/null || true)
              if [ -z "$behind_by" ]; then
                echo "SKIP: could not compare PR head with the current main branch."
                skipped=$((skipped+1)); echo "::endgroup::"; continue
              fi

              if [ "$behind_by" -ne 0 ]; then
                echo "SKIP: PR head is behind current main by $behind_by commit(s)."
                echo "Wait for the source branch automation to rebuild from latest main and rerun CI."
                skipped=$((skipped+1)); echo "::endgroup::"; continue
              fi

              if gh pr merge "$num" --repo "$REPO" --merge --match-head-commit "$sha"; then
                echo "MERGED PR #$num."
                merged=$((merged+1))
              else
                echo "SKIP: merge failed (conflicts or branch protection)."
                skipped=$((skipped+1))
              fi
              echo "::endgroup::"
            done
          done

          echo "Done. Merged: $merged, Skipped: $skipped."
