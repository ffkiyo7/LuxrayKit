name: PokeDB Environment Refresh

on:
  # Runs after the usual PokeDB publish window (around 15:30 UTC / 00:30 JST).
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pokedb-environment-refresh
  cancel-in-progress: false

env:
  UPDATE_BRANCH: automation/pokedb-environment-refresh
  COMMIT_MESSAGE: 'data: refresh PokeDB environment snapshot'
  PR_TITLE: 'data: refresh PokeDB environment snapshot'
  SOURCE_SNAPSHOT: src/data/external/pokedb/current_environment_snapshot.json
  PUBLIC_SNAPSHOT: public/data/pokedb/reg-ma-environment.json

jobs:
  refresh:
    name: Refresh PokeDB environment snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater token is configured
        env:
          POKEDB_UPDATE_TOKEN: ${{ secrets.POKEDB_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${POKEDB_UPDATE_TOKEN:-}" ]; then
            echo "::error::Repository secret POKEDB_UPDATE_TOKEN is required to push the generated branch and open the PR."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.POKEDB_UPDATE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated snapshots
        run: npm run data:pokedb:environment

      - name: Detect generated snapshot changes
        id: changes
        run: |
          set -euo pipefail

          allowed_files="$(mktemp)"
          printf '%s\n' "$SOURCE_SNAPSHOT" "$PUBLIC_SNAPSHOT" > "$allowed_files"

          changed_files="$(git diff --name-only)"
          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PokeDB snapshots already match remote data."
            exit 0
          fi

          unexpected_files="$(printf '%s\n' "$changed_files" | grep -Fvx -f "$allowed_files" || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::PokeDB refresh changed files outside the generated snapshots:"
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          if ! git diff --quiet -- "$SOURCE_SNAPSHOT" "$PUBLIC_SNAPSHOT"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'changed_files<<EOF'
              git diff --name-only -- "$SOURCE_SNAPSHOT" "$PUBLIC_SNAPSHOT"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated snapshots
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$UPDATE_BRANCH"
          git add "$SOURCE_SNAPSHOT" "$PUBLIC_SNAPSHOT"
          git commit -m "$COMMIT_MESSAGE"

      - name: Push updater branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git fetch origin "refs/heads/${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}" || true
          git push --force-with-lease="refs/heads/${UPDATE_BRANCH}" origin "HEAD:refs/heads/${UPDATE_BRANCH}"

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.POKEDB_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/pokedb-environment-refresh-pr.md"
          cat > "$body_file" <<'EOF'
          This PR was generated by the PokeDB Environment Refresh workflow.

          It refreshes the generated environment snapshots by running:

          ```bash
          npm run data:pokedb:environment
          ```

          The script reuses the existing Worker parser and environment audit logic. Existing CI validates tests, build, and the Worker dry-run before this can merge.

          Changed generated files:
          - `src/data/external/pokedb/current_environment_snapshot.json`
          - `public/data/pokedb/reg-ma-environment.json`

          If the GitHub-hosted runner cannot reach PokeDB, for example because PokeDB returns 403, this workflow fails before pushing a commit.
          EOF

          pr_number="$(gh pr list \
            --repo "$GH_REPO" \
            --base main \
            --head "$UPDATE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GH_REPO" \
              --title "$PR_TITLE" \
              --body-file "$body_file"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$body_file"
          fi
