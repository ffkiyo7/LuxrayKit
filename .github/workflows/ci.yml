name: CI

on:
  # Run once per change via the PR, and once on main when work actually lands. Avoids the
  # duplicate run you'd get from push + pull_request firing on the same feature-branch commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build, and validate Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate generated Pokemon facts
        run: npm run data:pokemon-facts:check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      # End-to-end gates for the daily auto-merge pipeline: boot the built PWA,
      # verify offline behavior, and prove generated team samples render.
      # Uses the runner's preinstalled Google Chrome (playwright.config.ts sets
      # channel: 'chrome'), so no browser download is needed.
      - name: Run PWA smoke tests
        run: npm run test:pwa -- tests/pwa/offline.spec.ts tests/pwa/team-samples.spec.ts

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Validate Worker bundle
        run: npm run worker:environment:check

  # Blocking UI gate. Runs after `test` so a broken build doesn't also burn the
  # image pull — Actions minutes are metered on this private repo.
  visual:
    name: Mobile visual regression
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately calls the same wrapper developers run locally instead of a
      # `container:` block: the image tag is derived from the installed
      # @playwright/test version, so CI and local machines cannot drift onto
      # different Chromium builds — which is the entire point of containerizing.
      - name: Run visual regression in the Playwright image
        run: npm run test:visual

      # expected/actual/diff PNG triplet for every failed snapshot.
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
