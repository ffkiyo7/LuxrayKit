name: CI

on:
  # Run once per change via the PR, and once on main when work actually lands. Avoids the
  # duplicate run you'd get from push + pull_request firing on the same feature-branch commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build, and validate Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      # Minimal end-to-end gate for the daily auto-merge pipeline: boots the built
      # PWA, verifies service-worker registration, team CRUD, and offline reload.
      # Uses the runner's preinstalled Google Chrome (playwright.config.ts sets
      # channel: 'chrome'), so no browser download is needed.
      - name: Run PWA offline smoke test
        run: npm run test:pwa -- tests/pwa/offline.spec.ts

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Validate Worker bundle
        run: npm run worker:environment:check
