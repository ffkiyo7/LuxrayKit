name: CI

on:
  # Run once per change via the PR, and once on main when work actually lands. Avoids the
  # duplicate run you'd get from push + pull_request firing on the same feature-branch commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build, and validate Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate generated Pokemon facts
        run: npm run data:pokemon-facts:check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      # End-to-end gates for the daily auto-merge pipeline: boot the built PWA,
      # verify offline behavior, prove generated team samples render, and hold the
      # environment first paint to its measured JS budget.
      # Uses the runner's preinstalled Google Chrome (playwright.config.ts sets
      # channel: 'chrome'), so no browser download is needed.
      - name: Run PWA smoke tests
        run: npm run test:pwa -- tests/pwa/offline.spec.ts tests/pwa/team-samples.spec.ts tests/pwa/first-paint-budget.spec.ts

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Validate Worker bundle
        run: npm run worker:environment:check

  # Decides whether a PR can change pixels. Deny-list, not allow-list: the visual
  # job is skipped only when EVERY changed file sits under a path known not to reach
  # the rendered UI, so a new directory or config file is checked by default instead
  # of slipping through. Pushes to main always run it.
  #
  # Skipped on purpose:
  #   docs, Markdown, the Worker (screenshots are served fixtures, never the API),
  #   maintenance scripts, workflows other than this one, and the data files the
  #   visual spec replaces with frozen fixtures — the PokeDB snapshot and the
  #   VGCPastes team library (tests/pwa/fixtures/). That last part is what keeps the
  #   automation/* data PRs off this gate.
  changes:
    name: Detect UI-affecting changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      visual: ${{ steps.filter.outputs.visual }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "Not a pull request: run the visual gate."
            echo "visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed.txt
          echo "Changed files:"; cat changed.txt
          ui_files=$(grep -v -E \
            -e '^docs/' \
            -e '\.md$' \
            -e '^LICENSE$' \
            -e '^cloudflare/' \
            -e '^scripts/.*\.(mjs|test\.mjs)$' \
            -e '^\.github/workflows/(claude|daily-auto-merge|visual-baseline)\.yml$' \
            -e '^public/data/pokedb/' \
            -e '^src/data/external/pokedb/' \
            -e '^src/data/external/vgcpastes/' \
            changed.txt || true)
          if [ -n "$ui_files" ]; then
            echo "UI-affecting changes:"; echo "$ui_files"
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "No UI-affecting changes: skipping the visual gate."
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi

  # Blocking UI gate, run alongside `test` (the repo is public, so parallel runs
  # cost wall-clock time, not metered minutes). A skipped run satisfies the
  # required check; the condition is written so that a failed `changes` job
  # (empty output) runs the gate rather than silently skipping it.
  visual:
    name: Mobile visual regression
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.visual != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately calls the same wrapper developers run locally instead of a
      # `container:` block: the image tag is derived from the installed
      # @playwright/test version, so CI and local machines cannot drift onto
      # different Chromium builds — which is the entire point of containerizing.
      - name: Run visual regression in the Playwright image
        run: npm run test:visual

      # expected/actual/diff PNG triplet for every failed snapshot.
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
