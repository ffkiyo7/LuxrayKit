name: Weekly VGCPastes team-library refresh

# Rebuilds automation/vgcpastes-team-refresh from the latest main via
# scripts/create-vgcpastes-refresh-pr.mjs and opens / updates its PR; daily-auto-merge
# takes it from there. Runs 00:30 Tuesday Asia/Shanghai (16:30 UTC Monday), the slot the
# old VPS cron used; also runnable manually.
#
# Pushes made with GITHUB_TOKEN do not fire pull_request workflows, so after a push this
# workflow dispatches ci.yml on the automation branch itself. Its check runs land on the
# PR head commit under the same names, which is what the main ruleset and
# daily-auto-merge look for. Opening the PR needs the repository setting
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '30 16 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: vgcpastes-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REFRESH_BRANCH: automation/vgcpastes-team-refresh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Refresh team library and open / update PR
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before=$(git ls-remote origin "refs/heads/$REFRESH_BRANCH" | cut -f1)
          npm run data:vgcpastes:pr
          after=$(git ls-remote origin "refs/heads/$REFRESH_BRANCH" | cut -f1)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI on the refreshed branch
        if: steps.refresh.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$REFRESH_BRANCH"
