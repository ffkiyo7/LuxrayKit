[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-pipeline-harness"
version = "0.1.0"
description = "Owner-controlled, recoverable development pipeline harness for LuxrayKit"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3",
]

[project.scripts]
dev-pipeline-harness = "dev_pipeline_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
